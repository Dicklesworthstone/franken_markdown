name: Fuzz (m7fs.1)

on:
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-build:
    name: Build fuzz targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install clang (libFuzzer linker)
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Source-shape self-test
        run: scripts/fuzz-smoke.sh --self-test
      - name: Compile three fuzz binaries
        env:
          CC: clang
          CXX: clang++
        run: scripts/fuzz-smoke.sh --build-only

  fuzz-canary:
    name: libFuzzer canary (${{ matrix.seconds }}s)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: fuzz-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Run 30s per target
        env:
          CC: clang
          CXX: clang++
        run: scripts/fuzz-smoke.sh --seconds 30 scheduled
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: |
            fuzz/artifacts/
            tests/artifacts/fuzz/
          if-no-files-found: ignore
