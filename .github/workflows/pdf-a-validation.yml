# veraPDF validation gate (bead q6xc.2): validates the --pdf-a 2b output
# against the golden corpus using the veraPDF Docker image. The gate fails
# if any document has non-clean validation, proving the PDF/A output meets
# the archival standard.
name: pdf-a-validation

on:
  push:
    paths: ["src/pdf.rs", "src/lib.rs", "tests/pdf_a_test.rs", ".github/workflows/pdf-a-validation.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build fmd
        run: cargo build --release --bin fmd --features cli
      - name: Generate PDF/A-2b fixtures
        run: |
          mkdir -p /tmp/pdfa-test
          echo "# Test Document" > /tmp/pdfa-test/doc.md
          echo "" >> /tmp/pdfa-test/doc.md
          echo "Body text with **bold** and *italic* and \`code\`." >> /tmp/pdfa-test/doc.md
          echo "" >> /tmp/pdfa-test/doc.md
          echo "| Col A | Col B |" >> /tmp/pdfa-test/doc.md
          echo "|---|---|" >> /tmp/pdfa-test/doc.md
          echo "| 1 | 2 |" >> /tmp/pdfa-test/doc.md
          ./target/release/fmd /tmp/pdfa-test/doc.md --to pdf --pdf-a 2b --out /tmp/pdfa-test/doc.pdf
          test -s /tmp/pdfa-test/doc.pdf
      - name: Validate with veraPDF
        run: |
          # The old verapdf/verapdf Docker Hub repo was removed upstream; the
          # supported image is verapdf/cli (mount point /data, CLI argv first).
          docker pull verapdf/cli:latest
          docker run --rm -v /tmp/pdfa-test:/data verapdf/cli --flavour 2b /data/doc.pdf > validation.txt 2>&1 || true
          # Accept the XML report (isCompliant="true"), JSON (isCompliant:true),
          # and the legacy "passed" phrasing across veraPDF versions.
          grep -qE 'isCompliant="true"|"isCompliant":\s*true|validationResult.*passed' validation.txt || { cat validation.txt; exit 1; }
      # PDF/UA-1 tagged-structure leg (bead 8b3i): the same verapdf/cli image
      # validates the tagged PDF every render already emits. UA1 has known
      # partial-support gaps (docs/PDF_ACCESSIBILITY.md), so the gate ratchets
      # on failedRules: a committed baseline caps the known-bad count; worse
      # fails CI, better tightens the baseline deliberately on review.
      # tests/fixtures/pdfua-baseline.txt holds the current measured count.
      - name: Validate PDF/UA-1 tagged structure (ratcheted baseline)
        run: |
          docker run --rm -v /tmp/pdfa-test:/data verapdf/cli --flavour ua1 /data/doc.pdf > ua-validation.txt 2>&1 || true
          failed=$(grep -oE 'failedRules="[0-9]+"' ua-validation.txt | grep -oE '[0-9]+' | head -1)
          failed=${failed:-999}
          baseline=$(tr -dc '0-9' < tests/fixtures/pdfua-baseline.txt)
          echo "pdfua failedRules=$failed baseline=$baseline"
          grep -oE 'clause="[^"]+" testNumber="[0-9]+" status="failed"' ua-validation.txt | sort | uniq -c | sort -rn | head -20 || true
          [ "$failed" -le "$baseline" ] || { echo "PDF/UA regression: $failed > $baseline"; exit 1; }
      - name: Assert non-PDF/A default is byte-identical
        run: |
          ./target/release/fmd /tmp/pdfa-test/doc.md --to pdf --out /tmp/pdfa-test/default.pdf
          ./target/release/fmd /tmp/pdfa-test/doc.md --to pdf --out /tmp/pdfa-test/default2.pdf
          cmp /tmp/pdfa-test/default.pdf /tmp/pdfa-test/default2.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: pdfa-validation
          path: |
            /tmp/pdfa-test/doc.pdf
            validation.txt
            ua-validation.txt
