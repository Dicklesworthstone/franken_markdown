<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval' frankenmd:; connect-src frankenmd:; style-src 'unsafe-inline'; frame-src blob: data:; img-src data: blob:">
  <style>
    html, body, #preview { margin: 0; width: 100%; height: 100%; background: #f7f7f4; }
    body { overflow: hidden; }
    #preview { border: 0; display: block; }
  </style>
</head>
<body>
  <iframe id="preview" title="Rendered Markdown preview" sandbox="allow-same-origin"></iframe>
  <script type="module">
    import { createRenderer } from './franken_markdown.js';

    const bridge = window.webkit.messageHandlers.frankenBridge;
    const preview = document.querySelector('#preview');
    let latestRequest = 0;

    function withRenderedFontScale(html, rawScale) {
      const parsed = Number(rawScale);
      const scale = Number.isFinite(parsed) ? Math.min(1.6, Math.max(0.7, parsed)) : 1;
      const override = `<style id="fmd-host-text-size">:root{--fmd-base:${16 * scale}px!important}</style>`;
      return String(html).replace('</head>', `${override}</head>`);
    }

    try {
      // wasm-bindgen's default initializer attempts instantiateStreaming on
      // the custom-scheme response. WebKit serves the bytes correctly, but a
      // custom WKURLScheme response is not a normal HTTP Response and the
      // streaming path rejects it. Materialize the allow-listed local bytes
      // and pass the BufferSource explicitly to the same package API.
      const wasmResponse = await fetch('./pkg/franken_markdown_bg.wasm');
      const wasmBytes = await wasmResponse.arrayBuffer();
      const renderer = await createRenderer(wasmBytes);
      window.frankenRender = async (command) => {
        const requestID = Number(command.requestID);
        latestRequest = Math.max(latestRequest, requestID);
        const started = performance.now();
        try {
          const output = await renderer.renderHtml(String(command.markdown), command.options || {});
          if (requestID !== latestRequest) return false;
          preview.srcdoc = withRenderedFontScale(output.text(), command.options?.renderFontScale);
          bridge.postMessage({
            type: 'result', requestID,
            elapsedMS: performance.now() - started,
            outputBytes: output.bytes.byteLength,
            diagnosticCount: output.diagnostics.length
          });
          return true;
        } catch (error) {
          bridge.postMessage({type: 'failure', requestID, message: String(error)});
          return false;
        }
      };
      window.frankenExportPdf = async (command) => {
        const requestID = Number(command.requestID);
        try {
          const output = await renderer.renderPdf(String(command.markdown), command.options || {});
          let binary = '';
          const bytes = output.bytes;
          const len = bytes.byteLength;
          for (let i = 0; i < len; i++) {
            binary += String.fromCharCode(bytes[i]);
          }
          const base64 = btoa(binary);
          bridge.postMessage({
            type: 'exportPdfResult',
            requestID,
            base64,
            byteLength: len,
            diagnosticCount: output.diagnostics.length
          });
          return true;
        } catch (error) {
          bridge.postMessage({type: 'exportFailure', requestID, message: String(error)});
          return false;
        }
      };

      window.frankenExportHtml = async (command) => {
        const requestID = Number(command.requestID);
        try {
          const output = await renderer.renderHtml(String(command.markdown), command.options || {});
          const htmlText = withRenderedFontScale(output.text(), command.options?.renderFontScale);
          bridge.postMessage({
            type: 'exportHtmlResult',
            requestID,
            htmlText,
            byteLength: new TextEncoder().encode(htmlText).byteLength,
            diagnosticCount: output.diagnostics.length
          });
          return true;
        } catch (error) {
          bridge.postMessage({type: 'exportFailure', requestID, message: String(error)});
          return false;
        }
      };

      bridge.postMessage({type: 'ready'});
    } catch (error) {
      bridge.postMessage({type: 'failure', message: `WASM initialization failed: ${error}`});
    }
  </script>
</body>
</html>
