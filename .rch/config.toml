# Remote checks need the committed fuzz seeds, distribution files and proof
# fixtures. Dispatcher-wide corpus/artifacts exclusions omit these inputs.
# Keep source inputs while excluding generated output and credentials.
[transfer]
exclude_patterns = [
    "target/",
    "target_*/",
    ".rch-target*/",
    ".rch_target*/",
    ".rch-tmp/",
    ".rch-results/",
    ".rch_cargo_home*/",
    "*.rlib",
    "*.rmeta",
    "node_modules/",
    ".beads/*.db",
    ".beads/*.db-*",
    ".beads/*.backup_*",
    ".beads/*.corrupt_*",
    ".beads/*.orphan_*",
    ".beads/recovery*/",
    "/scripts/videos_ref/",
    "/fuzz/artifacts/",
    ".env",
    ".env.*",
    "*.pem",
    "*.key",
    "credentials.json",
    ".cargo/credentials",
    ".cargo/credentials.toml",
    "id_rsa",
    "id_ed25519",
    "id_ecdsa",
    "id_dsa",
    ".netrc",
    "secrets.json",
    "secrets.yaml",
    "secrets.yml",
    "secrets.toml",
    "secrets.env",
    "secrets.txt",
    "secrets.conf",
    "secrets.cfg",
    "secrets.properties",
    "secrets.xml",
]
