<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval' frankenmd:; connect-src frankenmd:; style-src 'unsafe-inline'; frame-src blob: data:; img-src data: blob:">
  <style>
    html, body, #preview { margin: 0; width: 100%; height: 100%; background: #f7f7f4; }
    body { overflow: hidden; }
    #preview { border: 0; display: block; }
  </style>
</head>
<body>
  <iframe id="preview" title="Rendered Markdown preview" sandbox="allow-same-origin"></iframe>
  <script type="module">
    import { createRenderer } from './franken_markdown.js';

    const bridge = window.webkit.messageHandlers.frankenBridge;
    const preview = document.querySelector('#preview');
    let latestRequest = 0;
    let stagedPreview = null;

    try {
      // wasm-bindgen's default initializer attempts instantiateStreaming on
      // the custom-scheme response. WebKit serves the bytes correctly, but a
      // custom WKURLScheme response is not a normal HTTP Response and the
      // streaming path rejects it. Materialize the allow-listed local bytes
      // and pass the BufferSource explicitly to the same package API.
      const wasmResponse = await fetch('./pkg/franken_markdown_bg.wasm');
      const wasmBytes = await wasmResponse.arrayBuffer();
      const renderer = await createRenderer(wasmBytes);
      window.frankenRender = async (command) => {
        const requestID = Number(command.requestID);
        if (requestID < latestRequest) return false;
        latestRequest = requestID;
        stagedPreview = null;
        const started = performance.now();
        try {
          const output = await renderer.renderHtml(markdownSource(command), command.options || {});
          if (requestID !== latestRequest) return false;
          stagedPreview = {
            requestID, html: output.text(),
            elapsedMS: performance.now() - started,
            outputBytes: output.bytes.byteLength,
            diagnosticCount: output.diagnostics.length
          };
          return true;
        } catch (error) {
          if (requestID === latestRequest) {
            bridge.postMessage({type: 'failure', requestID, message: String(error)});
          }
          return false;
        }
      };
      // Keep large HTML inside WebKit, but let Swift confirm the source/settings
      // owner after the synchronous Rust call has finished. Obsolete work must
      // not replace the iframe while the user is already editing another draft.
      window.frankenCommitPreview = (requestID) => {
        requestID = Number(requestID);
        if (requestID !== latestRequest || stagedPreview?.requestID !== requestID) return false;
        const {html, ...result} = stagedPreview;
        stagedPreview = null;
        preview.srcdoc = html;
        bridge.postMessage({type: 'result', ...result});
        return true;
      };
      window.frankenDiscardPreview = (requestID) => {
        requestID = Number(requestID);
        latestRequest = Math.max(latestRequest, requestID + 1);
        if (stagedPreview?.requestID === requestID) stagedPreview = null;
        return true;
      };

      // Pull one bounded chunk only after Swift has validated and written the
      // preceding chunk. Retain the renderer's bytes, never a whole-output
      // binary/base64 string or a second UTF-8 HTML conversion.
      const exportChunkSize = 65_536;
      const exportByteLimit = 512 * 1024 * 1024;
      let latestExportRequest = 0;
      let activeExport = null;
      // Eight 256-entry tables let CRC32 consume a word pair per iteration.
      // The fixed 8 KiB table never scales with the document or chunk count.
      const crcTables = Array.from({length: 8}, () => new Uint32Array(256));
      for (let value = 0; value < 256; value++) {
        let crc = value;
        for (let bit = 0; bit < 8; bit++) crc = (crc >>> 1) ^ (crc & 1 ? 0xedb88320 : 0);
        crcTables[0][value] = crc >>> 0;
      }
      for (let slice = 1; slice < 8; slice++) {
        for (let value = 0; value < 256; value++) {
          const crc = crcTables[slice - 1][value];
          crcTables[slice][value] = (crc >>> 8) ^ crcTables[0][crc & 255];
        }
      }
      const checksum = bytes => {
        const [t0, t1, t2, t3, t4, t5, t6, t7] = crcTables;
        const length = bytes.byteLength;
        let crc = 0xffffffff;
        let index = 0;
        for (; index + 8 <= length; index += 8) {
          crc ^= bytes[index] | (bytes[index + 1] << 8) |
            (bytes[index + 2] << 16) | (bytes[index + 3] << 24);
          crc = t7[crc & 255] ^ t6[(crc >>> 8) & 255] ^
            t5[(crc >>> 16) & 255] ^ t4[crc >>> 24] ^
            t3[bytes[index + 4]] ^ t2[bytes[index + 5]] ^
            t1[bytes[index + 6]] ^ t0[bytes[index + 7]];
        }
        for (; index < length; index++) crc = (crc >>> 8) ^ t0[(crc ^ bytes[index]) & 255];
        return ((crc ^ 0xffffffff) >>> 0).toString(16).padStart(8, '0');
      };
      const validRequest = value => Number.isSafeInteger(value) && value > 0;

      // Native uploads UTF-8 in one acknowledged chunk at a time. The released
      // renderer still needs a complete String, but neither IPC nor base64
      // conversion holds another whole-document payload. Keep only the latest
      // completed source so changing options or exporting can reuse its handle.
      const sourceByteLimit = 64 * 1024 * 1024;
      let latestSourceID = 0;
      let sourceUpload = null;
      let residentSource = null;
      const requireSourceUpload = sourceID => {
        if (!validRequest(sourceID) || sourceUpload?.sourceID !== sourceID) {
          throw new Error('The source upload is no longer available.');
        }
        return sourceUpload;
      };
      const markdownSource = command => {
        if (!Object.hasOwn(command, 'sourceID')) return String(command.markdown);
        if (!validRequest(command.sourceID) || residentSource?.sourceID !== command.sourceID) {
          throw new Error('The source handle is no longer available.');
        }
        return residentSource.markdown;
      };
      window.frankenBeginSource = command => {
        const {sourceID, byteLength, chunkSize} = command;
        if (!validRequest(sourceID) || sourceID <= latestSourceID) {
          throw new Error('Source identifiers must increase.');
        }
        if (!Number.isSafeInteger(byteLength) || byteLength < 0 || byteLength > sourceByteLimit ||
            chunkSize !== exportChunkSize) {
          throw new Error('The source upload exceeds the 64 MiB limit or has an invalid manifest.');
        }
        if (sourceUpload) throw new Error('Another source upload is still in progress.');
        latestSourceID = sourceID;
        // Native serializes operations that use this cache. Drop the previous
        // source before accumulating its replacement, not after the final join.
        residentSource = null;
        sourceUpload = {
          sourceID, byteLength, receivedBytes: 0, nextIndex: 0, parts: [],
          decoder: new TextDecoder('utf-8', {fatal: true, ignoreBOM: true})
        };
        return JSON.stringify({sourceID, byteLength, chunkSize});
      };
      window.frankenAppendSourceChunk = command => {
        const transfer = requireSourceUpload(command.sourceID);
        const expectedBytes = Math.min(exportChunkSize, transfer.byteLength - transfer.receivedBytes);
        if (!Number.isSafeInteger(command.index) || command.index !== transfer.nextIndex ||
            expectedBytes <= 0 || command.byteLength !== expectedBytes ||
            typeof command.base64 !== 'string' ||
            command.base64.length !== Math.ceil(expectedBytes / 3) * 4 ||
            typeof command.checksum !== 'string' || !/^[0-9a-f]{8}$/.test(command.checksum)) {
          throw new Error('The source chunk has an invalid order or size.');
        }
        const binary = atob(command.base64);
        if (binary.length !== expectedBytes) throw new Error('The source chunk has an invalid size.');
        const bytes = new Uint8Array(expectedBytes);
        for (let index = 0; index < expectedBytes; index++) bytes[index] = binary.charCodeAt(index);
        if (checksum(bytes) !== command.checksum) throw new Error('The source chunk failed its integrity check.');
        try {
          const text = transfer.decoder.decode(bytes, {stream: true});
          if (text) transfer.parts.push(text);
        } catch (error) {
          sourceUpload = null;
          throw new Error('The source upload is not valid UTF-8.');
        }
        transfer.receivedBytes += expectedBytes;
        transfer.nextIndex++;
        return JSON.stringify({sourceID: transfer.sourceID, index: command.index,
          receivedBytes: transfer.receivedBytes});
      };
      window.frankenFinishSource = command => {
        const transfer = requireSourceUpload(command.sourceID);
        if (command.byteLength !== transfer.byteLength || command.chunkCount !== transfer.nextIndex ||
            transfer.receivedBytes !== transfer.byteLength) {
          throw new Error('The source upload is incomplete.');
        }
        try {
          const tail = transfer.decoder.decode();
          if (tail) transfer.parts.push(tail);
          residentSource = {sourceID: transfer.sourceID, markdown: transfer.parts.join('')};
          return JSON.stringify({sourceID: transfer.sourceID, byteLength: transfer.byteLength,
            chunkCount: transfer.nextIndex});
        } finally {
          sourceUpload = null;
        }
      };
      window.frankenCancelSource = sourceID => {
        if (!validRequest(sourceID)) return false;
        let released = false;
        if (sourceUpload?.sourceID === sourceID) { sourceUpload = null; released = true; }
        if (residentSource?.sourceID === sourceID) { residentSource = null; released = true; }
        return released;
      };
      const requireExport = requestID => {
        if (!validRequest(requestID) || activeExport?.requestID !== requestID || !activeExport.bytes) {
          throw new Error('The export transfer is no longer available.');
        }
        return activeExport;
      };
      const stageExport = async (command, render) => {
        const requestID = command.requestID;
        if (!validRequest(requestID) || requestID <= latestExportRequest) {
          throw new Error('Export request identifiers must increase.');
        }
        if (activeExport) throw new Error('Another export is still in progress.');
        latestExportRequest = requestID;
        const transfer = {requestID, bytes: null, nextIndex: 0};
        activeExport = transfer;
        try {
          const output = await render();
          if (activeExport !== transfer) throw new Error('The export was cancelled.');
          if (!ArrayBuffer.isView(output.bytes) || output.bytes.BYTES_PER_ELEMENT !== 1) {
            throw new Error('The renderer returned invalid export bytes.');
          }
          if (output.bytes.byteLength > exportByteLimit) {
            throw new Error('The export exceeds the 512 MiB transfer limit.');
          }
          // Keep the existing typed-array view (including its byteOffset).
          // No allocation proportional to output length is made by transport.
          transfer.bytes = output.bytes;
          return JSON.stringify({
            requestID, byteLength: output.bytes.byteLength,
            extension: output.extension, mimeType: output.mimeType,
            diagnosticCount: output.diagnostics.length, chunkSize: exportChunkSize
          });
        } catch (error) {
          if (activeExport === transfer) activeExport = null;
          throw error;
        }
      };
      window.frankenReadExportChunk = command => {
        const transfer = requireExport(command.requestID);
        const index = command.index;
        if (!Number.isSafeInteger(index) || index < 0 || index !== transfer.nextIndex) {
          throw new Error('Export chunks must be read once in sequence.');
        }
        const start = index * exportChunkSize;
        if (start >= transfer.bytes.byteLength) throw new Error('The export has no remaining chunks.');
        const bytes = transfer.bytes.subarray(start, start + exportChunkSize);
        let binary = '';
        for (let offset = 0; offset < bytes.byteLength; offset += 0x8000) {
          binary += String.fromCharCode.apply(null, bytes.subarray(offset, offset + 0x8000));
        }
        const result = JSON.stringify({
          requestID: transfer.requestID, index,
          base64: btoa(binary), byteLength: bytes.byteLength, checksum: checksum(bytes)
        });
        transfer.nextIndex++;
        return result;
      };
      window.frankenFinishExport = command => {
        const transfer = requireExport(command.requestID);
        const expectedChunks = Math.ceil(transfer.bytes.byteLength / exportChunkSize);
        if (command.byteLength !== transfer.bytes.byteLength || command.chunkCount !== expectedChunks ||
            transfer.nextIndex !== expectedChunks) {
          throw new Error('The export transfer is incomplete.');
        }
        activeExport = null;
        return true;
      };
      window.frankenCancelExport = requestID => {
        if (!validRequest(requestID) || activeExport?.requestID !== requestID) return false;
        activeExport = null;
        return true;
      };
      window.frankenExportPdf = command => stageExport(command, () =>
        renderer.renderPdf(markdownSource(command), command.options || {}));
      window.frankenExportHtml = command => stageExport(command, () =>
        renderer.renderHtml(markdownSource(command), command.options || {}));

      window.frankenAnalyze = async (command) => {
        const markdown = markdownSource(command);
        const [stats, audit, search] = await Promise.all([
          renderer.documentStats(markdown),
          renderer.accessibilityAudit(markdown),
          renderer.searchIndex(markdown)
        ]);
        return JSON.stringify({stats, audit, search});
      };

      window.frankenExportArtifact = command => stageExport(command, async () => {
        const markdown = markdownSource(command);
        const options = command.options || {};
        switch (String(command.format)) {
          case 'svg': return await renderer.renderSvg(markdown, options);
          case 'epub': return await renderer.renderEpub(markdown, options);
          case 'interactive-html': return await renderer.renderInteractiveHtml(markdown, options);
          case 'search-index': {
            const json = JSON.stringify(await renderer.searchIndex(markdown), null, 2);
            return {
              bytes: new TextEncoder().encode(json),
              extension: 'json', mimeType: 'application/json', diagnostics: []
            };
          }
          default: throw new Error(`Unsupported artifact format: ${command.format}`);
        }
      });

      window.frankenDiff = async (command) => {
        const output = await renderer.renderSemanticDiff(
          String(command.oldMarkdown), String(command.newMarkdown), command.options || {}
        );
        const metrics = await renderer.semanticDiff(
          String(command.oldMarkdown), String(command.newMarkdown), command.options || {}
        );
        return JSON.stringify({html: output.text(), metrics});
      };

      window.frankenBook = command => stageExport(command, async () => {
        const files = Array.isArray(command.files) ? command.files : [];
        const options = {...(command.options || {})};
        if (command.format !== 'pdf') {
          // Book sites have always been safe-only. The current renderer checks
          // its site contract strictly; PDF metadata must stay in the PDF lane.
          delete options.author;
          delete options.pageNumbers;
          options.allowRawHtml = false;
        }
        return command.format === 'pdf'
          ? await renderer.renderBookPdf(files, options)
          : await renderer.renderBookSite(files, options);
      });

      bridge.postMessage({type: 'ready'});
    } catch (error) {
      bridge.postMessage({type: 'failure', message: `WASM initialization failed: ${error}`});
    }
  </script>
</body>
</html>
