<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval' frankenmd:; connect-src frankenmd:; style-src 'unsafe-inline'; frame-src blob: data:; img-src data: blob:">
  <style>
    html, body, #preview { margin: 0; width: 100%; height: 100%; background: #f7f7f4; }
    body { overflow: hidden; }
    #preview { border: 0; display: block; }
  </style>
</head>
<body>
  <iframe id="preview" title="Rendered Markdown preview" sandbox="allow-same-origin"></iframe>
  <script type="module">
    import { createRenderer } from './franken_markdown.js';

    const bridge = window.webkit.messageHandlers.frankenBridge;
    const preview = document.querySelector('#preview');
    let latestRequest = 0;

    try {
      // wasm-bindgen's default initializer attempts instantiateStreaming on
      // the custom-scheme response. WebKit serves the bytes correctly, but a
      // custom WKURLScheme response is not a normal HTTP Response and the
      // streaming path rejects it. Materialize the allow-listed local bytes
      // and pass the BufferSource explicitly to the same package API.
      const wasmResponse = await fetch('./pkg/franken_markdown_bg.wasm');
      const wasmBytes = await wasmResponse.arrayBuffer();
      const renderer = await createRenderer(wasmBytes);
      window.frankenRender = async (command) => {
        const requestID = Number(command.requestID);
        latestRequest = Math.max(latestRequest, requestID);
        const started = performance.now();
        try {
          const output = await renderer.renderHtml(String(command.markdown), command.options || {});
          if (requestID !== latestRequest) return false;
          preview.srcdoc = output.text();
          bridge.postMessage({
            type: 'result', requestID,
            elapsedMS: performance.now() - started,
            outputBytes: output.bytes.byteLength,
            diagnosticCount: output.diagnostics.length
          });
          return true;
        } catch (error) {
          bridge.postMessage({type: 'failure', requestID, message: String(error)});
          return false;
        }
      };
      window.frankenExportPdf = async (command) => {
        const requestID = Number(command.requestID);
        try {
          const output = await renderer.renderPdf(String(command.markdown), command.options || {});
          let binary = '';
          const bytes = output.bytes;
          const len = bytes.byteLength;
          const chunkSize = 0x8000;
          for (let i = 0; i < len; i += chunkSize) {
            binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
          }
          const base64 = btoa(binary);
          bridge.postMessage({
            type: 'exportPdfResult',
            requestID,
            base64,
            byteLength: len,
            diagnosticCount: output.diagnostics.length
          });
          return true;
        } catch (error) {
          bridge.postMessage({type: 'exportFailure', requestID, message: String(error)});
          return false;
        }
      };

      window.frankenExportHtml = async (command) => {
        const requestID = Number(command.requestID);
        try {
          const output = await renderer.renderHtml(String(command.markdown), command.options || {});
          const htmlText = output.text();
          bridge.postMessage({
            type: 'exportHtmlResult',
            requestID,
            htmlText,
            byteLength: new TextEncoder().encode(htmlText).byteLength,
            diagnosticCount: output.diagnostics.length
          });
          return true;
        } catch (error) {
          bridge.postMessage({type: 'exportFailure', requestID, message: String(error)});
          return false;
        }
      };

      window.frankenAnalyze = async (command) => {
        const markdown = String(command.markdown);
        const [stats, audit, search] = await Promise.all([
          renderer.documentStats(markdown),
          renderer.accessibilityAudit(markdown),
          renderer.searchIndex(markdown)
        ]);
        return JSON.stringify({stats, audit, search});
      };

      window.frankenExportArtifact = async (command) => {
        const markdown = String(command.markdown);
        const options = command.options || {};
        let output;
        switch (String(command.format)) {
          case 'svg': output = await renderer.renderSvg(markdown, options); break;
          case 'epub': output = await renderer.renderEpub(markdown, options); break;
          case 'interactive-html': output = await renderer.renderInteractiveHtml(markdown, options); break;
          case 'search-index': {
            const json = JSON.stringify(await renderer.searchIndex(markdown), null, 2);
            return JSON.stringify({
              base64: btoa(unescape(encodeURIComponent(json))),
              byteLength: new TextEncoder().encode(json).byteLength,
              extension: 'json', mimeType: 'application/json', diagnostics: []
            });
          }
          default: throw new Error(`Unsupported artifact format: ${command.format}`);
        }
        const bytes = output.bytes;
        let binary = '';
        const chunkSize = 0x8000;
        for (let i = 0; i < bytes.byteLength; i += chunkSize) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
        }
        return JSON.stringify({
          base64: btoa(binary), byteLength: bytes.byteLength,
          extension: output.extension, mimeType: output.mimeType,
          diagnostics: output.diagnostics
        });
      };

      window.frankenDiff = async (command) => {
        const output = await renderer.renderSemanticDiff(
          String(command.oldMarkdown), String(command.newMarkdown), command.options || {}
        );
        const metrics = await renderer.semanticDiff(
          String(command.oldMarkdown), String(command.newMarkdown), command.options || {}
        );
        return JSON.stringify({html: output.text(), metrics});
      };

      window.frankenBook = async (command) => {
        const files = Array.isArray(command.files) ? command.files : [];
        const options = command.options || {};
        const output = command.format === 'pdf'
          ? await renderer.renderBookPdf(files, options)
          : await renderer.renderBookSite(files, options);
        const bytes = output.bytes;
        let binary = '';
        const chunkSize = 0x8000;
        for (let i = 0; i < bytes.byteLength; i += chunkSize) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
        }
        return JSON.stringify({
          base64: btoa(binary), byteLength: bytes.byteLength,
          extension: output.extension, mimeType: output.mimeType,
          diagnostics: output.diagnostics
        });
      };

      bridge.postMessage({type: 'ready'});
    } catch (error) {
      bridge.postMessage({type: 'failure', message: `WASM initialization failed: ${error}`});
    }
  </script>
</body>
</html>
